# =============================================================
#  M&M Fan Room — unofficial Marcus & Martinus fan site
# =============================================================
baseURL = "https://mmfanroom.com/"
languageCode = "en-us"
title = "M&M Fan Room"
enableEmoji = true

# Pretty section URLs, no taxonomies needed for now
disableKinds = ["taxonomy", "term"]

[params]
  shortName       = "M&M Fan Room"
  tagline         = "For the fans. By the fans."
  description     = "An independent, fan-made space for everyone who loves Marcus & Martinus. Music, memories, concerts, timelines and fan moments."
  unofficialBadge = "Unofficial Fan Site"
  # Change this to the real official site once confirmed.
  officialWebsite = "https://marcusandmartinus.com"
  # Full disclaimer shown on the home page + footer.
  disclaimer = "This is an independent fan project. We are not affiliated with Marcus & Martinus, their management, record label, tour organizers, or official channels. For official news, tickets, merch and announcements, always use the official channels."

[markup.goldmark.renderer]
  unsafe = true

